# Server Port Configuration
server.port=${PORT:8080}

# Database Configuration
# Automatically supports:
# 1) Render / Heroku via DATABASE_URL or SPRING_DATASOURCE_URL
# 2) Local MySQL via SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/villageconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# 3) Local embedded fallback (H2 persistent file) so the app runs out-of-the-box without manual MySQL setup
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/villageconnect;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
# Hibernate 6 automatically chooses dialect based on the active DataSource connection
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configurations
jwt.secret=${JWT_SECRET:VillageConnectSuperSecretKeyThatIsVeryLongAndSecure1234567890!}
jwt.expirationMs=86400000

# Gemini API Integration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# File Upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
